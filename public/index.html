<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1打席野球バトル</title>
  <style>
    body { font-family: sans-serif; background: linear-gradient(120deg,#122,#245); color: #fff; margin: 0; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 20px; }
    .card { background: rgba(0,0,0,.35); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .nav { font-size: 1.5rem; font-weight: 800; color: #ffe655; }
    button { border: 0; border-radius: 12px; padding: 10px 16px; margin: 6px; font-size: 1rem; font-weight: 700; }
    .big { font-size: 1.2rem; padding: 14px 20px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚾ 1打席野球バトル</h1>
    <div id="home" class="card">
      <p class="nav">4けたを つたえよう！</p>
      <button id="create" class="big">ルームをつくる</button>
      <input id="joinCode" maxlength="4" placeholder="1234" />
      <button id="join" class="big">ルームに入る</button>
    </div>

    <div id="lobby" class="card hidden">
      <p>ルーム: <b id="roomCode"></b></p>
      <p class="nav" id="lobbyNav">やくわりを えらんでね！</p>
      <div id="roleSel">
        <button data-role="PITCHER">投手</button>
        <button data-role="BATTER">打者</button>
      </div>
      <p id="lobbyWait">あいてを まってるよ！</p>
    </div>

    <div id="game" class="card hidden">
      <p id="pitchLabel"></p>
      <p class="nav" id="phaseNav"></p>
      <div>
        <button data-el="FIRE">🔥炎</button>
        <button data-el="WATER">💧水</button>
        <button data-el="GRASS">🌿草</button>
      </div>
      <button id="spam">れんだして！</button>
      <button id="magic">まきゅう！</button>
      <button id="hit">いま！うて！</button>
      <p id="resultText"></p>
    </div>

    <div id="result" class="card hidden">
      <p class="nav" id="winner"></p>
      <button id="rematch">もう1回！</button>
      <p id="rematchWait"></p>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
